<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Control de Productividad - UCI Enfermería</title>
<style>

:root{
  --bg:#f4f6f8; --panel:#ffffff; --text:#1c2530; --muted:#6b7686; --border:#e1e6eb;
  --primary:#2563a8; --primary-dark:#1c4c82; --primary-light:#e8f0fa;
  --ok:#1e8a5f; --ok-bg:#e5f6ee; --warn:#b8860b; --warn-bg:#fdf3d8; --danger:#c0392b; --danger-bg:#fbe8e6;
  --radius:12px; --shadow:0 1px 3px rgba(20,30,50,.08), 0 1px 2px rgba(20,30,50,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{margin:0 0 .5em 0; font-weight:600;}
p{margin:.3em 0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:15px;}
#topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  background:var(--primary); color:#fff; padding:10px 16px; box-shadow:var(--shadow);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-icon{font-size:26px;}
.brand-title{font-weight:700; font-size:16px;}
.brand-sub{font-size:12px; opacity:.85;}
.user-badge{display:flex; align-items:center; gap:10px; font-size:13px;}
.user-badge.hidden{display:none;}
#main{max-width:920px; margin:0 auto; padding:14px 12px 60px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
.card h2{font-size:17px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; font-weight:600; text-transform:uppercase; letter-spacing:.02em;}
.field input, .field select{
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--text);
}
.field input:focus, .field select:focus{outline:2px solid var(--primary-light); border-color:var(--primary);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:9px; border:1px solid transparent; font-weight:600; font-size:14.5px;
  background:var(--primary); color:#fff; transition:filter .1s;
}
.btn:hover{filter:brightness(1.06);}
.btn:active{filter:brightness(.94);}
.btn-block{width:100%;}
.btn-secondary{background:#fff; color:var(--primary); border:1px solid var(--primary);}
.btn-ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5);}
.btn-outline{background:#fff; color:var(--text); border:1px solid var(--border);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{padding:6px 10px; font-size:12.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.tabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
.tab{padding:9px 14px; border-radius:20px; background:#fff; border:1px solid var(--border); color:var(--muted); font-weight:600; font-size:13.5px; white-space:nowrap;}
.tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.center{text-align:center;}
.row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.chip{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700;}
.chip-ok{background:var(--ok-bg); color:var(--ok);}
.chip-warn{background:var(--warn-bg); color:var(--warn);}
.chip-danger{background:var(--danger-bg); color:var(--danger);}
.chip-muted{background:#eef1f4; color:var(--muted);}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--border);}
th{color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.02em;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.item-line{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); gap:8px;}
.item-line:last-child{border-bottom:none;}
.item-main{flex:1; min-width:0;}
.item-name{font-weight:600; font-size:14px;}
.item-meta{font-size:12px; color:var(--muted);}
.item-sub{font-weight:700; color:var(--primary); white-space:nowrap;}
.total-box{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:var(--radius); margin-top:8px;}
.total-box.ok{background:var(--ok-bg); color:var(--ok);}
.total-box.warn{background:var(--warn-bg); color:var(--warn);}
.total-box.danger{background:var(--danger-bg); color:var(--danger);}
.total-box .t-label{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.total-box .t-value{font-size:26px; font-weight:800;}
.total-box .t-pct{font-size:13px; font-weight:700;}
.progress{height:8px; border-radius:6px; background:#e4e8ec; overflow:hidden; margin-top:8px;}
.progress > div{height:100%; border-radius:6px;}
.fab-add{position:sticky; bottom:12px; margin-top:10px;}
.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:38px; height:38px; border-radius:9px; border:1px solid var(--border); background:#fff; font-size:18px; font-weight:700;}
.stepper input{width:60px; text-align:center; padding:8px 4px;}
.modal-overlay{position:fixed; inset:0; background:rgba(15,25,40,.5); display:flex; align-items:flex-end; justify-content:center; z-index:100;}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal{background:#fff; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:18px;}
@media(min-width:640px){.modal{border-radius:16px;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.close-x{background:none; border:none; font-size:22px; color:var(--muted); padding:2px 8px;}
.search-box{width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:9px; margin-bottom:10px;}
.chipbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px;}
.chipbar .chip-cat{white-space:nowrap; padding:6px 12px; border-radius:16px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600; color:var(--muted);}
.chipbar .chip-cat.active{background:var(--primary-light); color:var(--primary-dark); border-color:var(--primary);}
.act-list{max-height:44vh; overflow-y:auto; border:1px solid var(--border); border-radius:10px;}
.act-item{padding:11px 12px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px;}
.act-item:last-child{border-bottom:none;}
.act-item:active{background:var(--primary-light);}
.act-item .an{font-size:13.5px; font-weight:600;}
.act-item .at{font-size:11.5px; color:var(--muted);}
.grado-btns{display:flex; gap:8px; margin:10px 0;}
.grado-btns button{flex:1; padding:12px 4px; border-radius:9px; border:1px solid var(--border); background:#fff; font-weight:700;}
.grado-btns button.sel{background:var(--primary); color:#fff; border-color:var(--primary);}
.grado-btns button small{display:block; font-weight:500; font-size:11px; margin-top:2px;}
.empty-state{text-align:center; padding:30px 10px; color:var(--muted);}
.empty-state .ico{font-size:36px; margin-bottom:6px;}
.login-wrap{max-width:400px; margin:40px auto;}
.login-logo{text-align:center; font-size:44px; margin-bottom:6px;}
.link-btn{background:none; border:none; color:var(--primary); font-weight:600; font-size:13.5px; padding:6px;}
.summary-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;}
@media(max-width:640px){.summary-cards{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center;}
.stat-card .num{font-size:22px; font-weight:800; color:var(--primary-dark);}
.stat-card .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; margin-top:2px;}
.toast{position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-60px); background:#1c2530; color:#fff; padding:10px 18px; border-radius:10px; font-size:13.5px; z-index:200; transition:transform .25s; box-shadow:var(--shadow);}
.toast.show{transform:translateX(-50%) translateY(0);}
.subtabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px;}
.subtabs button{padding:7px 12px; border-radius:8px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600; color:var(--muted);}
.subtabs button.active{background:var(--text); color:#fff; border-color:var(--text);}
.form-row{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;}
.badge-origen{font-size:10px; padding:1px 7px; border-radius:8px; background:#eef1f4; color:var(--muted); margin-left:6px;}
.clickable{cursor:pointer;}
.dim{opacity:.55;}
footer.appfoot{text-align:center; color:var(--muted); font-size:12px; padding:18px 10px 40px;}
hr.sep{border:none; border-top:1px solid var(--border); margin:14px 0;}
.inline-edit input{width:64px; padding:6px; border:1px solid var(--border); border-radius:6px; text-align:center;}

</style>
</head>
<body>
<div id="toast" class="toast"></div>
<header id="topbar">
  <div class="brand">
    <span class="brand-icon">🩺</span>
    <div>
      <div class="brand-title">Productividad UCI</div>
      <div class="brand-sub" id="brandSub">Registro de actividades de enfermería</div>
    </div>
  </div>
  <div id="userBadge" class="user-badge hidden">
    <span id="userBadgeName"></span>
    <button id="btnLogout" class="btn btn-ghost btn-sm">Salir</button>
  </div>
</header>
<main id="main"></main>
<div id="modalRoot"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

/* ---------------------------- Utilidades ---------------------------- */
function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtFechaLarga(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d + ' ' + meses[m-1] + ' ' + y;
}
function minToHHMM(min){
  const sign = min < 0 ? '-' : '';
  min = Math.round(Math.abs(min||0));
  const h = Math.floor(min/60), m = min%60;
  return sign + h + 'h ' + String(m).padStart(2,'0') + 'm';
}
function minToHM(min){
  min = Math.round(min||0);
  const h = Math.floor(min/60), m = min%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function csvEscape(v){
  v = String(v==null?'':v);
  if(/[",\n;]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

}

    const metaCfg = await db.collection('meta').doc('config').get();
    if(!metaCfg.exists) await db.collection('meta').doc('config').set(defaultConfig());
    const personalSnap = await db.collection('personal').limit(1).get();
    if(personalSnap.empty){
      const batch = db.batch();
      PERSONAL_SEED.forEach(p=> batch.set(db.collection('personal').doc(p.id), p));
      await batch.commit();
    }
    const pacientesSnap = await db.collection('pacientes').limit(1).get();
    if(pacientesSnap.empty){
      const batch = db.batch();
      PACIENTES_SEED.forEach(p=> batch.set(db.collection('pacientes').doc(p.id), p));
      await batch.commit();
    }
  }catch(e){
    console.error('Error inicializando datos en la nube', e);
  }
}

function detachFirestoreListeners(){
  firestoreUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  firestoreUnsubs = [];
}

function attachFirestoreListeners(){
  detachFirestoreListeners();
  firestoreUnsubs.push(db.collection('personal').onSnapshot(snap=>{
    STATE.personal = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, e=>console.error('listener personal', e)));
  firestoreUnsubs.push(db.collection('pacientes').onSnapshot(snap=>{
    STATE.pacientes = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, e=>console.error('listener pacientes', e)));
  firestoreUnsubs.push(db.collection('registros').onSnapshot(snap=>{
    STATE.registros = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, e=>console.error('listener registros', e)));
  firestoreUnsubs.push(db.collection('meta').doc('catalogo').onSnapshot(doc=>{
    if(doc.exists) STATE.catalogo = doc.data().categorias || [];
    render();
  }, e=>console.error('listener catalogo', e)));
  firestoreUnsubs.push(db.collection('meta').doc('config').onSnapshot(doc=>{
    if(doc.exists) STATE.config = doc.data();
    render();
  }, e=>console.error('listener config', e)));
  firestoreUnsubs.push(db.collection('authorized_emails').onSnapshot(snap=>{
    AUTHORIZED_EMAILS = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, e=>console.error('listener authorized_emails', e)));
}

function pacientesActivos(){

function render(){
  const main = document.getElementById('main');
  if(AUTH_STATE !== 'ready'){
    const badge = document.getElementById('userBadge');

    document.getElementById('brandSub').textContent = 'Registro de actividades de enfermería';

/* ============================ REGISTRO ================================ */
let draft = null; // { fecha, turno, items:[] }

function ensureDraft(){
  if(!draft){
    draft = { fecha: todayISO(), turno: 'GD', items: [] };
  }
}

function draftTotal(){
  return draft.items.reduce((s,i)=>s+i.subtotal,0);
}

function viewRegistro(){
  ensureDraft();
  const p = STATE.personal.find(x=>x.id===SESSION.personalId);
  const total = draftTotal();
  const horasEstandar = turnoHoras(draft.turno);
  const pct = horasEstandar>0 ? (total/60)/horasEstandar : 0;
  let boxClass = 'ok', msg = 'Dentro de lo esperado';
  if(pct >= 1){ boxClass='danger'; msg='¡Supera el tiempo estándar del turno!'; }
  else if(pct >= (STATE.config.margenAlerta||0.9)){ boxClass='warn'; msg='Cerca del límite del turno'; }

  const itemsHtml = draft.items.length ? draft.items.map(it => `
    <div class="item-line">
      <div class="item-main">
        <div class="item-name">${escapeHtml(it.actividadNombre)} ${it.grado ? `<span class="badge-origen">Grado ${it.grado.replace('grado','')}</span>` : ''}</div>
        <div class="item-meta">${escapeHtml(it.categoriaNombre)} · ${it.cantidad} × ${it.tiempoUnit} min ${it.pacienteNombre ? '· 🧑‍🦱 '+escapeHtml(it.pacienteNombre) : '· <span class="dim">sin paciente / general</span>'}</div>
      </div>
      <div class="item-sub">${it.subtotal} min</div>
      <button class="btn btn-outline btn-sm" data-remove-item="${it.id}">✕</button>
    </div>
  `).join('') : `<div class="empty-state"><div class="ico">📋</div>Aún no agregas actividades.<br>Toca "+ Agregar actividad" para empezar.</div>`;

  return `
  <div class="card">
    <div class="row">
      <h2>Turno de ${escapeHtml(p ? p.nombres : '')}</h2>
    </div>
    <div class="grid2">
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="draftFecha" value="${draft.fecha}">
      </div>
      <div class="field">
        <label>Turno</label>
        <select id="draftTurno">
          <option value="GD" ${draft.turno==='GD'?'selected':''}>Diurno (GD)</option>
          <option value="GN" ${draft.turno==='GN'?'selected':''}>Nocturno (GN)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row"><h2>Actividades del turno</h2><span class="muted small">${draft.items.length} registradas</span></div>
    <div>${itemsHtml}</div>
    <button class="btn btn-secondary btn-block fab-add" id="btnAddActividad">+ Agregar actividad</button>
  </div>

  <div class="total-box ${boxClass}">
    <div>
      <div class="t-label">Total del turno</div>
      <div class="t-value">${minToHHMM(total)}</div>
    </div>
    <div style="text-align:right;">
      <div class="t-pct">${Math.round(pct*100)}% de ${horasEstandar}h</div>
      <div class="small">${msg}</div>
    </div>
  </div>
  <div class="progress"><div style="width:${Math.min(pct*100,100)}%; background:${boxClass==='danger'?'var(--danger)':boxClass==='warn'?'var(--warn)':'var(--ok)'};"></div></div>

  <div class="card" style="margin-top:14px;">
    <button class="btn btn-block" id="btnGuardarTurno">💾 Guardar registro del turno</button>
    <button class="btn btn-outline btn-block" style="margin-top:8px;" id="btnVerHistorial">Ver mis registros anteriores</button>
  </div>
  `;
}

function viewHistorial(){
  const p = STATE.personal.find(x=>x.id===SESSION.personalId);
  const mine = STATE.registros.filter(r=>r.personalId===SESSION.personalId).sort((a,b)=> b.fecha.localeCompare(a.fecha) || (b.creado-a.creado));
  const rows = mine.map(r=>{
    const horasEstandar = r.turno==='GN' ? (STATE.config.horasTurnoGN||12) : (STATE.config.horasTurnoGD||12);
    const pct = horasEstandar>0 ? (r.totalMin/60)/horasEstandar : 0;
    const chip = pct>=1 ? 'chip-danger' : (pct>=(STATE.config.margenAlerta||0.9) ? 'chip-warn' : 'chip-ok');
    return `<tr class="clickable" data-view-registro="${r.id}">
      <td>${fmtFechaLarga(r.fecha)}</td>
      <td>${r.turno==='GD'?'Diurno':'Nocturno'}</td>
      <td>${minToHM(r.totalMin)}</td>
      <td><span class="chip ${chip}">${Math.round(pct*100)}%</span></td>
    </tr>`;
  }).join('');
  return `
  <div class="card">
    <button class="link-btn" id="btnBackRegistro">← Volver al registro actual</button>

    ${mine.length ? `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Turno</th><th>Total</th><th>%</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty-state"><div class="ico">🗂️</div>Todavía no tienes turnos guardados.</div>`}
  </div>
  <div id="registroDetalle"></div>
  `;
}

/* --------------------------- Modal: agregar actividad --------------------------- */
// modalState.step: 'actividad' | 'paciente' | 'cantidad'
// El grado (1/2/3) se elige de forma independiente al paciente -- igual que
// en el Excel original, donde el grado era un dato de la actividad (cuántos
// pacientes de ese grado la recibieron), y el paciente era solo un registro
// aparte (nombre/cama/fechas) sin grado asociado.
let modalState = { open:false, step:'actividad', categoriaId:null, query:'', actividad:null, grado:'grado1', pacienteId:undefined, cantidad:1 };

function openAddModal(){
  modalState = { open:true, step:'actividad', categoriaId: STATE.catalogo[0] ? STATE.catalogo[0].id : null, query:'', actividad:null, grado:'grado1', pacienteId:undefined, cantidad:1 };
  renderModal();
}
function closeModal(){
  modalState.open = false;
  document.getElementById('modalRoot').innerHTML = '';
}

function renderModal(){
  const root = document.getElementById('modalRoot');
  if(!modalState.open){ root.innerHTML=''; return; }

  if(modalState.step === 'actividad'){
    const cats = STATE.catalogo;
    const chipbar = cats.map(c=>`<button class="chip-cat ${c.id===modalState.categoriaId?'active':''}" data-cat="${c.id}">${escapeHtml(c.nombre)}</button>`).join('');
    let acts = [];
    cats.forEach(c=>{ c.actividades.forEach(a=>{ if(a.activa!==false) acts.push({...a, categoriaId:c.id, categoriaNombre:c.nombre}); }); });
    if(modalState.query.trim()){
      const q = modalState.query.trim().toLowerCase();
      acts = acts.filter(a=>a.nombre.toLowerCase().includes(q));
    } else {
      acts = acts.filter(a=>a.categoriaId===modalState.categoriaId);
    }
    const gradoBtns = `
      <div class="field">
        <label>Grado del paciente para esta actividad</label>
        <div class="grado-btns">
          <button class="${modalState.grado==='grado1'?'sel':''}" data-pick-grado="grado1">Grado 1</button>
          <button class="${modalState.grado==='grado2'?'sel':''}" data-pick-grado="grado2">Grado 2</button>
          <button class="${modalState.grado==='grado3'?'sel':''}" data-pick-grado="grado3">Grado 3</button>
        </div>
      </div>`;
    const list = acts.map(a=>{
      const timeLabel = a.gradoDependiente ? ('Según grado seleccionado ('+a.tiempos[modalState.grado]+' min)') : (a.tiempoFijo+' min estándar');
      return `<div class="act-item clickable" data-pick-act="${a.id}" data-pick-cat="${a.categoriaId}">
        <div><div class="an">${escapeHtml(a.nombre)}</div><div class="at">${escapeHtml(timeLabel)}</div></div>
        <div class="muted">›</div>
      </div>`;
    }).join('') || `<div class="empty-state small">Sin resultados.</div>`;

    root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-head"><h3>Agregar actividad</h3><button class="close-x" id="modalClose">×</button></div>
        ${gradoBtns}
        <input class="search-box" id="modalSearch" placeholder="Buscar actividad..." value="${escapeHtml(modalState.query)}">
        ${modalState.query.trim() ? '' : `<div class="chipbar">${chipbar}</div>`}
        <div class="act-list">${list}</div>
      </div>
    </div>`;
  } else if(modalState.step === 'paciente'){
    const a = modalState.actividad;
    const activos = pacientesActivos();
    const list = activos.map(p=>`
      <div class="act-item clickable" data-pick-paciente="${p.id}">
        <div><div class="an">${escapeHtml(p.nombres+' '+p.apellidos)}</div><div class="at">${p.cama?('Cama '+escapeHtml(p.cama)):''}</div></div>
        <div class="muted">›</div>
      </div>`).join('');
    const sinPacienteOpt = `<div class="act-item clickable" data-pick-paciente="">
        <div><div class="an">Sin paciente / actividad general</div><div class="at">Para tareas administrativas u otras no ligadas a un paciente en particular</div></div>
        <div class="muted">›</div>
      </div>`;
    root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-head"><h3>${escapeHtml(a.nombre)}</h3><button class="close-x" id="modalClose">×</button></div>
        <p class="muted small">¿A qué paciente se la hiciste? (opcional, solo para el registro — el tiempo ya quedó fijado según el grado que elegiste)</p>
        <div class="act-list">${sinPacienteOpt}${list}</div>
        <button class="btn btn-outline btn-block" style="margin-top:10px;" id="btnBackToList">← Elegir otra actividad</button>
      </div>
    </div>`;
  } else if(modalState.step === 'cantidad'){
    const a = modalState.actividad;
    const paciente = modalState.pacienteId ? STATE.pacientes.find(p=>p.id===modalState.pacienteId) : null;
    const tiempoUnit = a.gradoDependiente ? a.tiempos[modalState.grado] : a.tiempoFijo;
    const subtotal = tiempoUnit!=null ? tiempoUnit*modalState.cantidad : null;

    root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-head"><h3>${escapeHtml(a.nombre)}</h3><button class="close-x" id="modalClose">×</button></div>
        <p class="muted small">${escapeHtml(a.categoriaNombre)}${a.gradoDependiente ? ' · Grado '+modalState.grado.replace('grado','') : ''}${paciente ? ' · 🧑‍🦱 '+escapeHtml(paciente.nombres+' '+paciente.apellidos) : ' · Sin paciente / general'}</p>
        <p>Tiempo estándar: <b>${tiempoUnit!=null?tiempoUnit+' min':'—'}</b></p>
        <div class="field" style="margin-top:12px;">
          <label>Cantidad de veces realizada</label>
          <div class="stepper">
            <button id="qtyMinus">−</button>
            <input id="qtyInput" type="number" min="1" value="${modalState.cantidad}">
            <button id="qtyPlus">+</button>
          </div>
        </div>
        <div class="total-box ok" style="margin-top:10px;">
          <div class="t-label">Subtotal</div>
          <div class="t-value">${subtotal!=null ? subtotal+' min' : '—'}</div>
        </div>
        <button class="btn btn-block" style="margin-top:14px;" id="btnConfirmAdd">Agregar al turno</button>
        <button class="btn btn-outline btn-block" style="margin-top:8px;" id="btnBackToPaciente">← Atrás</button>
      </div>
    </div>`;
  }

  // bind modal events
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  const closeBtn = document.getElementById('modalClose');
  if(closeBtn) closeBtn.onclick = closeModal;

  const search = document.getElementById('modalSearch');
  if(search){
    search.oninput = (e)=>{ modalState.query = e.target.value; renderModal(); const el=document.getElementById('modalSearch'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);} };
  }
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.onclick = ()=>{ modalState.categoriaId = el.getAttribute('data-cat'); renderModal(); };
  });
  document.querySelectorAll('[data-pick-grado]').forEach(el=>{
    el.onclick = ()=>{ modalState.grado = el.getAttribute('data-pick-grado'); renderModal(); };
  });
  document.querySelectorAll('[data-pick-act]').forEach(el=>{
    el.onclick = ()=>{
      const actId = el.getAttribute('data-pick-act');
      const catId = el.getAttribute('data-pick-cat');
      const cat = STATE.catalogo.find(c=>c.id===catId);
      const act = cat.actividades.find(x=>x.id===actId);
      modalState.actividad = {...act, categoriaId:cat.id, categoriaNombre:cat.nombre};
      modalState.pacienteId = undefined; modalState.cantidad = 1;
      modalState.step = 'paciente';
      renderModal();
    };
  });
  document.querySelectorAll('[data-pick-paciente]').forEach(el=>{
    el.onclick = ()=>{
      const pid = el.getAttribute('data-pick-paciente');
      modalState.pacienteId = pid || null;
      modalState.step = 'cantidad';
      renderModal();
    };
  });
  const backToList = document.getElementById('btnBackToList');
  if(backToList) backToList.onclick = ()=>{ modalState.actividad=null; modalState.step='actividad'; renderModal(); };
  const backToPaciente = document.getElementById('btnBackToPaciente');
  if(backToPaciente) backToPaciente.onclick = ()=>{ modalState.step='paciente'; renderModal(); };

  const qtyInput = document.getElementById('qtyInput');
  if(qtyInput){
    qtyInput.onchange = ()=>{ modalState.cantidad = Math.max(1, parseInt(qtyInput.value)||1); renderModal(); };
    document.getElementById('qtyMinus').onclick = ()=>{ modalState.cantidad = Math.max(1, modalState.cantidad-1); renderModal(); };
    document.getElementById('qtyPlus').onclick = ()=>{ modalState.cantidad = modalState.cantidad+1; renderModal(); };
  }
  const confirmBtn = document.getElementById('btnConfirmAdd');
  if(confirmBtn){
    confirmBtn.onclick = ()=>{
      const a = modalState.actividad;
      const paciente = modalState.pacienteId ? STATE.pacientes.find(p=>p.id===modalState.pacienteId) : null;
      const tiempoUnit = a.gradoDependiente ? a.tiempos[modalState.grado] : a.tiempoFijo;
      if(tiempoUnit==null){ toast('No se pudo calcular el tiempo para esta combinación'); return; }
      draft.items.push({
        id: uid('it'),
        categoriaId: a.categoriaId, categoriaNombre: a.categoriaNombre,
        actividadId: a.id, actividadNombre: a.nombre,
        grado: a.gradoDependiente ? modalState.grado : null,
        pacienteId: paciente ? paciente.id : null,
        pacienteNombre: paciente ? (paciente.nombres+' '+paciente.apellidos) : null,
        cantidad: modalState.cantidad, tiempoUnit: tiempoUnit,
        subtotal: tiempoUnit*modalState.cantidad
      });
      closeModal();
      render();
      toast('Actividad agregada');
    };
  }
}

/* ============================ EVENTOS VISTA ============================ */
function bindViewEvents(){
  // Login enfermero
  const btnLoginEnf = document.getElementById('btnLoginEnfermero');
  if(btnLoginEnf){
    btnLoginEnf.onclick = ()=>{
      const pid = document.getElementById('loginPersonal').value;
      const p = STATE.personal.find(x=>x.id===pid);
      if(p){
        SESSION = { tipo:'enfermero', personalId:p.id };
        draft = null;
        goto('registro');
      } else {
        toast('Selecciona tu nombre de la lista');
      }
    };
  }
  const btnGoLic = document.getElementById('btnGoLic');
  if(btnGoLic) btnGoLic.onclick = ()=>{ SESSION = { tipo:'licenciada' }; goto('licDash'); };

  // Registro
  const draftFecha = document.getElementById('draftFecha');
  if(draftFecha) draftFecha.onchange = ()=>{ draft.fecha = draftFecha.value; };
  const draftTurno = document.getElementById('draftTurno');
  if(draftTurno) draftTurno.onchange = ()=>{ draft.turno = draftTurno.value; render(); };
  document.querySelectorAll('[data-remove-item]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-remove-item');
      draft.items = draft.items.filter(i=>i.id!==id);
      render();
    };
  });
  const btnAddAct = document.getElementById('btnAddActividad');
  if(btnAddAct) btnAddAct.onclick = openAddModal;
  const btnGuardar = document.getElementById('btnGuardarTurno');
  if(btnGuardar){
    btnGuardar.onclick = async ()=>{
      if(draft.items.length===0){ toast('Agrega al menos una actividad'); return; }
      const p = STATE.personal.find(x=>x.id===SESSION.personalId);
      const id = uid('reg');
      const registro = {
        personalId: p.id, personalNombre: p.nombres+' '+p.apellidos,
        fecha: draft.fecha, turno: draft.turno,
        items: draft.items, totalMin: draftTotal(),
        creado: Date.now(), actualizado: Date.now(),
        creadoPorEmail: AUTH_USER ? AUTH_USER.email : null
      };
      btnGuardar.disabled = true;
      try{
        await db.collection('registros').doc(id).set(registro);
        draft = null;
        toast('Turno guardado correctamente');
        goto('historial');
      }catch(e){
        console.error(e);
        toast('Error guardando en la nube: '+e.message);
        btnGuardar.disabled = false;
      }
    };
  }
  const btnVerHist = document.getElementById('btnVerHistorial');
  if(btnVerHist) btnVerHist.onclick = ()=> goto('historial');
  const btnBackReg = document.getElementById('btnBackRegistro');
  if(btnBackReg) btnBackReg.onclick = ()=> goto('registro');

  document.querySelectorAll('[data-view-registro]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-view-registro');
      const r = STATE.registros.find(x=>x.id===id);
      showRegistroDetalle(r.items, 'registroDetalle', r.personalNombre+' — '+fmtFechaLarga(r.fecha)+' ('+(r.turno==='GD'?'Diurno':'Nocturno')+')');
    };
  });

  bindLicenciadaEvents();
}

/* ============================ LICENCIADA =============================== */
let licTab = 'resumen';
let licFiltro = { desde: null, hasta: null, turno: 'todos', personalId: 'todos' };
let licDetalleAbierto = null; // key of open group/patient detail

function firstDayOfMonthISO(){
  const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
}
function ensureLicFiltro(){
  if(!licFiltro.desde) licFiltro.desde = firstDayOfMonthISO();
  if(!licFiltro.hasta) licFiltro.hasta = todayISO();
}

function filteredRegistros(){
  ensureLicFiltro();
  return STATE.registros.filter(r=>{
    if(r.fecha < licFiltro.desde || r.fecha > licFiltro.hasta) return false;
    if(licFiltro.turno!=='todos' && r.turno!==licFiltro.turno) return false;
    if(licFiltro.personalId!=='todos' && r.personalId!==licFiltro.personalId) return false;
    return true;
  }).sort((a,b)=> b.fecha.localeCompare(a.fecha));
}

/* Agrupa los registros en: por (personal+fecha+turno) -> total y desglose por paciente.
   Esto evita que aparezcan varias filas "sueltas" solo porque se guardó el turno
   más de una vez; en cambio, si aparecen varias filas para la misma persona es
   porque corresponden a pacientes distintos dentro de ese turno. */
function buildResumenGroups(){
  const regs = filteredRegistros();
  const groups = {};
  regs.forEach(r=>{
    const key = r.personalId+'|'+r.fecha+'|'+r.turno;
    if(!groups[key]){
      groups[key] = {
        key, personalId:r.personalId, personalNombre:r.personalNombre, fecha:r.fecha, turno:r.turno,
        totalMin:0, porPaciente:{}
      };
    }
    const g = groups[key];
    g.totalMin += r.totalMin;
    r.items.forEach(it=>{
      const pid = it.pacienteId || '__general__';
      const pname = it.pacienteNombre || 'Actividades generales / administrativas';
      if(!g.porPaciente[pid]) g.porPaciente[pid] = { pacienteId: it.pacienteId, pacienteNombre: pname, totalMin:0, items:[] };
      g.porPaciente[pid].totalMin += it.subtotal;
      g.porPaciente[pid].items.push(it);
    });
  });
  return Object.values(groups).sort((a,b)=> b.fecha.localeCompare(a.fecha) || b.totalMin - a.totalMin);
}

function viewLicenciada(){
  ensureLicFiltro();
  const tabs = [
    ['resumen','Resumen por turno'],
    ['actividad','Por actividad'],
    ['personal','Personal'],
    ['pacientes','Pacientes'],
    ['catalogo','Catálogo'],
    ['accesos','Accesos'],
    ['config','Configuración']
  ];
  const subtabs = tabs.map(([k,l])=>`<button class="${licTab===k?'active':''}" data-lic-tab="${k}">${l}</button>`).join('');

  let body = '';
  if(licTab==='resumen') body = licResumen();
  else if(licTab==='actividad') body = licPorActividad();
  else if(licTab==='personal') body = licPersonal();
  else if(licTab==='pacientes') body = licPacientes();
  else if(licTab==='catalogo') body = licCatalogo();
  else if(licTab==='accesos') body = licAccesos();
  else if(licTab==='config') body = licConfig();

  return `
  <div class="subtabs">${subtabs}</div>
  ${body}
  `;
}

function licResumen(){
  const groups = buildResumenGroups();
  const margen = STATE.config.margenAlerta || 0.9;
  let excesoTurnos=0, excesoMinTotal=0, deficitFuerte=0, totalMinGD=0, totalMinGN=0;

  const rowsHtml = groups.map(g=>{
    const horasEstandar = g.turno==='GN' ? (STATE.config.horasTurnoGN||12) : (STATE.config.horasTurnoGD||12);
    const estandarMin = horasEstandar*60;
    const pct = estandarMin>0 ? g.totalMin/estandarMin : 0;
    let chip = 'chip-ok', estado='OK';
    if(pct>=1){ chip='chip-danger'; estado='Excede turno'; excesoTurnos++; excesoMinTotal += (g.totalMin-estandarMin); }
    else if(pct>=margen){ chip='chip-warn'; estado='Cerca del límite'; }
    else if(pct<0.5){ chip='chip-muted'; estado='Muy por debajo'; deficitFuerte++; }
    if(g.turno==='GN') totalMinGN += g.totalMin; else totalMinGD += g.totalMin;

    const pacientesArr = Object.values(g.porPaciente).sort((a,b)=>b.totalMin-a.totalMin);
    const subRows = pacientesArr.map((pp,idx)=>{
      const subKey = g.key+'|'+(pp.pacienteId||'__general__');
      return `<tr class="clickable dim" data-lic-detalle="${subKey}">
        <td></td>
        <td colspan="2" style="padding-left:22px;">↳ ${escapeHtml(pp.pacienteNombre)}</td>
        <td>${minToHM(pp.totalMin)}</td>
        <td colspan="2"></td>
      </tr>`;
    }).join('');

    return `<tr class="clickable" data-lic-detalle-grupo="${g.key}">
      <td>${escapeHtml(g.personalNombre)}</td>
      <td>${fmtFechaLarga(g.fecha)}</td>
      <td>${g.turno==='GD'?'Diurno':'Nocturno'}</td>
      <td><b>${minToHM(g.totalMin)}</b></td>
      <td>${horasEstandar}h</td>
      <td><span class="chip ${chip}">${Math.round(pct*100)}% ${estado}</span></td>
    </tr>` + subRows;
  }).join('');
  const tableRows = rowsHtml || `<tr><td colspan="6" class="empty-state">Sin registros en el rango seleccionado.</td></tr>`;

  return `
  ${licFiltrosHtml()}
  <div class="summary-cards">
    <div class="stat-card"><div class="num">${groups.length}</div><div class="lbl">Turnos registrados</div></div>
    <div class="stat-card"><div class="num">${minToHHMM(totalMinGD)}</div><div class="lbl">Total turno Diurno</div></div>
    <div class="stat-card"><div class="num">${minToHHMM(totalMinGN)}</div><div class="lbl">Total turno Nocturno</div></div>
    <div class="stat-card"><div class="num" style="color:var(--danger)">${minToHHMM(excesoMinTotal)}</div><div class="lbl">Exceso sobre turno estándar (${excesoTurnos} turno${excesoTurnos===1?'':'s'})</div></div>
  </div>
  <div class="card">
    <div class="row"><h2>Detalle por enfermero, turno y paciente</h2>
      <div>
        <button class="btn btn-outline btn-sm" id="btnExportCsvDetalle">Exportar CSV detalle</button>
        <button class="btn btn-outline btn-sm" id="btnExportCsvResumen">Exportar CSV resumen</button>
      </div>
    </div>
    <p class="muted small">Cada fila principal es el <b>total acumulado del turno</b> (todas las veces que se guardó ese día). Las filas debajo, con ↳, son el desglose por paciente atendido — es normal ver a la misma persona varias veces si atendió a varios pacientes. Toca cualquier fila para ver el detalle de actividades.</p>
    <div class="table-wrap"><table><thead><tr><th>Personal</th><th>Fecha</th><th>Turno</th><th>Total</th><th>Turno estándar</th><th>Estado</th></tr></thead><tbody>${tableRows}</tbody></table></div>
  </div>
  <div id="licDetalleBox"></div>
  `;
}

function licPorActividad(){
  const regs = filteredRegistros();

  let granTotal = 0;
  regs.forEach(r=> r.items.forEach(it=>{
    const key = it.categoriaNombre+' | '+it.actividadNombre+(it.grado?(' (G'+it.grado.slice(-1)+')'):'')+' | '+r.personalNombre;
    if(!map[key]) map[key] = {categoria: it.categoriaNombre, actividad: it.actividadNombre, grado: it.grado, personal: r.personalNombre, cantidad:0, minutos:0};
    map[key].cantidad += it.cantidad;

  ${licFiltrosHtml()}

    <div class="stat-card"><div class="num">${minToHHMM(granTotal)}</div><div class="lbl">Tiempo total sumado (todas las actividades y personal, en el rango filtrado)</div></div>

    <p class="muted small">Esto borra los datos compartidos en la nube para <b>todo el equipo</b>, no solo este navegador.</p>
    <button class="btn btn-danger" id="btnResetAll">Borrar todos los datos (para todo el equipo)</button>
  </div>`;
}

/* ---------------------------- Eventos licenciada ---------------------------- */
function bindLicenciadaEvents(){
  document.querySelectorAll('[data-lic-tab]').forEach(el=>{
    el.onclick = ()=>{ licTab = el.getAttribute('data-lic-tab'); render(); };
  });
  const filDesde = document.getElementById('filDesde');
  if(filDesde) filDesde.onchange = ()=>{ licFiltro.desde = filDesde.value; render(); };
  const filHasta = document.getElementById('filHasta');
  if(filHasta) filHasta.onchange = ()=>{ licFiltro.hasta = filHasta.value; render(); };
  const filTurno = document.getElementById('filTurno');
  if(filTurno) filTurno.onchange = ()=>{ licFiltro.turno = filTurno.value; render(); };
  const filPersonal = document.getElementById('filPersonal');
  if(filPersonal) filPersonal.onchange = ()=>{ licFiltro.personalId = filPersonal.value; render(); };

  document.querySelectorAll('[data-lic-detalle-grupo]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.getAttribute('data-lic-detalle-grupo');
      const groups = buildResumenGroups();
      const g = groups.find(x=>x.key===key);
      if(!g) return;
      const allItems = Object.values(g.porPaciente).flatMap(pp=>pp.items);
      showRegistroDetalle(allItems, 'licDetalleBox', g.personalNombre+' — '+fmtFechaLarga(g.fecha)+' ('+(g.turno==='GD'?'Diurno':'Nocturno')+') — Todos los pacientes');
    };
  });
  document.querySelectorAll('[data-lic-detalle]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-lic-detalle');
      const parts = key.split('|');
      const pid = parts.pop();
      const groupKey = parts.join('|');
      const groups = buildResumenGroups();
      const g = groups.find(x=>x.key===groupKey);
      if(!g) return;
      const pp = g.porPaciente[pid];
      if(!pp) return;
      showRegistroDetalle(pp.items, 'licDetalleBox', g.personalNombre+' — '+fmtFechaLarga(g.fecha)+' ('+(g.turno==='GD'?'Diurno':'Nocturno')+') — '+pp.pacienteNombre);
    };
  });

  const btnCsvDet = document.getElementById('btnExportCsvDetalle');
  if(btnCsvDet) btnCsvDet.onclick = exportCsvDetalle;
  const btnCsvRes = document.getElementById('btnExportCsvResumen');
  if(btnCsvRes) btnCsvRes.onclick = exportCsvResumen;

  // Personal
  document.querySelectorAll('[data-toggle-activo]').forEach(el=>{
    el.onchange = ()=>{
      db.collection('personal').doc(el.getAttribute('data-toggle-activo')).update({activo: el.checked})
        .catch(e=>{ console.error(e); toast('Error: '+e.message); });
    };
  });
  document.querySelectorAll('[data-del-personal]').forEach(el=>{
    el.onclick = ()=>{
      if(!confirm('¿Eliminar este personal? Sus registros históricos se conservarán.')) return;
      db.collection('personal').doc(el.getAttribute('data-del-personal')).delete()
        .catch(e=>{ console.error(e); toast('Error: '+e.message); });
    };
  });
  const btnAddPersonal = document.getElementById('btnAddPersonal');
  if(btnAddPersonal){
    btnAddPersonal.onclick = async ()=>{
      const nombres = document.getElementById('npNombres').value.trim();
      const apellidos = document.getElementById('npApellidos').value.trim();
      const cargo = document.getElementById('npCargo').value.trim();
      if(!nombres || !apellidos){ toast('Completa nombres y apellidos'); return; }
      try{
        await db.collection('personal').doc(uid('p')).set({nombres, apellidos, cargo, activo:true});
        toast('Personal agregado');
      }catch(e){ console.error(e); toast('Error: '+e.message); }
    };
  }

  // Pacientes
  document.querySelectorAll('[data-edit-cama]').forEach(el=>{
    el.onchange = ()=>{
      db.collection('pacientes').doc(el.getAttribute('data-edit-cama')).update({cama: el.value.trim()})
        .then(()=>toast('Cama actualizada'))
        .catch(e=>{ console.error(e); toast('Error: '+e.message); });
    };
  });
  document.querySelectorAll('[data-edit-grado]').forEach(el=>{
    el.onchange = ()=>{
      db.collection('pacientes').doc(el.getAttribute('data-edit-grado')).update({grado: Number(el.value)})
        .then(()=>toast('Grado actualizado'))
        .catch(e=>{ console.error(e); toast('Error: '+e.message); });
    };
  });
  document.querySelectorAll('[data-toggle-activo-paciente]').forEach(el=>{
    el.onchange = ()=>{
      db.collection('pacientes').doc(el.getAttribute('data-toggle-activo-paciente')).update({activo: el.checked})
        .catch(e=>{ console.error(e); toast('Error: '+e.message); });
    };
  });
  document.querySelectorAll('[data-del-paciente]').forEach(el=>{
    el.onclick = ()=>{
      if(!confirm('¿Eliminar este paciente? Los registros históricos que lo mencionan se conservarán.')) return;
      db.collection('pacientes').doc(el.getAttribute('data-del-paciente')).delete()
        .catch(e=>{ console.error(e); toast('Error: '+e.message); });
    };
  });
  const btnAddPaciente = document.getElementById('btnAddPaciente');
  if(btnAddPaciente){
    btnAddPaciente.onclick = async ()=>{
      const nombres = document.getElementById('npacNombres').value.trim();
      const apellidos = document.getElementById('npacApellidos').value.trim();
      const cama = document.getElementById('npacCama').value.trim();
      const grado = Number(document.getElementById('npacGrado').value);
      if(!nombres || !apellidos){ toast('Completa nombres y apellidos'); return; }
      try{
        await db.collection('pacientes').doc(uid('pac')).set({nombres, apellidos, cama, grado, fechaIngreso:todayISO(), fechaAlta:'', activo:true});
        toast('Paciente registrado');
      }catch(e){ console.error(e); toast('Error: '+e.message); }
    };
  }

  // Accesos (correos autorizados)
  const btnAddEmail = document.getElementById('btnAddEmailAcceso');
  if(btnAddEmail){
    btnAddEmail.onclick = async ()=>{
      const raw = document.getElementById('newEmailAcceso').value.trim().toLowerCase();
      if(!raw || !raw.includes('@')){ toast('Escribe un correo válido'); return; }
      try{
        await db.collection('authorized_emails').doc(raw).set({
          addedAt: Date.now(), addedBy: (AUTH_USER && AUTH_USER.email) || '?'
        });
        toast('Acceso otorgado a '+raw);
      }catch(e){ console.error(e); toast('Error: '+e.message); }
    };
  }
  document.querySelectorAll('[data-del-email]').forEach(el=>{
    el.onclick = ()=>{
      const email = el.getAttribute('data-del-email');
      if(!confirm('¿Quitar el acceso de '+email+'?')) return;
      db.collection('authorized_emails').doc(email).delete()
        .then(()=>toast('Acceso retirado'))
        .catch(e=>{ console.error(e); toast('Error: '+e.message); });
    };
  });

  // Catalogo
  document.querySelectorAll('[data-act][data-grado]').forEach(el=>{
    el.onchange = ()=>{
      const catId = el.getAttribute('data-cat');
      const actId = el.getAttribute('data-act');
      const grado = el.getAttribute('data-grado');
      const cat = STATE.catalogo.find(c=>c.id===catId);
      const act = cat.actividades.find(a=>a.id===actId);
      const val = el.value==='' ? null : Number(el.value);
      if(grado==='fijo'){ act.tiempoFijo = val; }
      else { act.tiempos[grado] = val; }
      saveCatalogo(); toast('Tiempo actualizado');
    };
  });
  document.querySelectorAll('[data-del-act]').forEach(el=>{
    el.onclick = ()=>{
      if(!confirm('¿Eliminar esta actividad del catálogo?')) return;
      const [catId, actId] = el.getAttribute('data-del-act').split('|');
      const cat = STATE.catalogo.find(c=>c.id===catId);
      cat.actividades = cat.actividades.filter(a=>a.id!==actId);
      saveCatalogo(); render();
    };
  });
  document.querySelectorAll('[data-add-act]').forEach(el=>{
    el.onclick = ()=>{
      const catId = el.getAttribute('data-add-act');
      const cat = STATE.catalogo.find(c=>c.id===catId);
      const nombre = document.getElementById('newAct_'+catId).value.trim();
      const tipo = document.getElementById('newActTipo_'+catId).value;
      const min = Number(document.getElementById('newActMin_'+catId).value || 0);
      if(!nombre){ toast('Escribe el nombre de la actividad'); return; }
      const newId = 'custom_' + uid('');
      if(tipo==='grado'){
        cat.actividades.push({id:newId, nombre, origen:'personalizado', gradoDependiente:true, tiempos:{grado1:min,grado2:min,grado3:min}});
      } else {
        cat.actividades.push({id:newId, nombre, origen:'personalizado', gradoDependiente:false, tiempoFijo:min});
      }
      saveCatalogo(); render(); toast('Actividad agregada al catálogo');
    };
  });

  // Config
  const btnSaveConfig = document.getElementById('btnSaveConfig');
  if(btnSaveConfig){
    btnSaveConfig.onclick = ()=>{
      STATE.config.horasTurnoGD = Number(document.getElementById('cfgGD').value)||12;
      STATE.config.horasTurnoGN = Number(document.getElementById('cfgGN').value)||12;
      STATE.config.margenAlerta = Math.min(100,Math.max(1,Number(document.getElementById('cfgMargen').value)||90))/100;
      saveConfig(); toast('Configuración guardada');
    };
  }
  const btnExportBackup = document.getElementById('btnExportBackup');
  if(btnExportBackup){
    btnExportBackup.onclick = ()=>{
      downloadFile('respaldo_productividad_'+todayISO()+'.json', JSON.stringify(STATE, null, 2), 'application/json');
    };
  }
  const btnImportBackup = document.getElementById('btnImportBackup');
  const fileImport = document.getElementById('fileImport');
  if(btnImportBackup && fileImport){
    btnImportBackup.onclick = ()=> fileImport.click();
    fileImport.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const incoming = JSON.parse(ev.target.result);
          const n = await mergeIntoFirestore(incoming);
          toast(n>0 ? ('Datos consolidados: '+n+' registro(s) nuevo(s)') : 'No había nada nuevo que consolidar');
        }catch(err){
          console.error(err);
          alert('El archivo no es un respaldo válido, o hubo un error subiéndolo a la nube.');
        }
      };
      reader.readAsText(file);
      fileImport.value = '';
    };
  }
  const btnSignOutCfg = document.getElementById('btnSignOutCfg');
  if(btnSignOutCfg) btnSignOutCfg.onclick = ()=>{ SESSION=null; auth.signOut(); };
  const btnResetAll = document.getElementById('btnResetAll');
  if(btnResetAll){
    btnResetAll.onclick = async ()=>{
      if(!confirm('Esto borrará TODOS los registros, personal, pacientes y catálogo. Como los datos están en la nube, esto afecta a TODO el equipo, no solo a este navegador. ¿Continuar?')) return;
      if(!confirm('Confirma nuevamente: esta acción no se puede deshacer.')) return;
      btnResetAll.disabled = true;
      try{
        await wipeFirestoreData();
        toast('Datos borrados');
        SESSION = null;
        goto('login');
      }catch(e){
        console.error(e);
        alert('Error borrando datos: '+e.message);
      }
      btnResetAll.disabled = false;
    };
  }
}

// Sube al Firestore compartido los registros/personal/pacientes de un
// respaldo JSON que no existan todavía (comparando por id), para
// consolidar lo que alguien haya exportado desde otro dispositivo.
async function mergeIntoFirestore(incoming){
  const batch = db.batch();
  let count = 0;
  if(Array.isArray(incoming.registros)){
    const existingIds = new Set(STATE.registros.map(r=>r.id));
    incoming.registros.forEach(r=>{
      if(!existingIds.has(r.id)){ const {id, ...rest} = r; batch.set(db.collection('registros').doc(r.id), rest); count++; }
    });
  }
  if(Array.isArray(incoming.personal)){
    const existingIds = new Set(STATE.personal.map(p=>p.id));
    incoming.personal.forEach(p=>{
      if(!existingIds.has(p.id)){ const {id, ...rest} = p; batch.set(db.collection('personal').doc(p.id), rest); count++; }
    });
  }
  if(Array.isArray(incoming.pacientes)){
    const existingIds = new Set(STATE.pacientes.map(p=>p.id));
    incoming.pacientes.forEach(p=>{
      if(!existingIds.has(p.id)){ const {id, ...rest} = p; batch.set(db.collection('pacientes').doc(p.id), rest); count++; }
    });
  }
  if(count>0) await batch.commit();
  return count;
}

// Borra todo el contenido compartido en Firestore (registros/personal/
// pacientes) y reinicia catálogo y configuración a los valores por
// defecto. No toca authorized_emails (el control de acceso no se borra).
async function wipeFirestoreData(){
  async function wipeCollection(name){
    const snap = await db.collection(name).get();
    const docs = snap.docs;
    for(let i=0;i<docs.length;i+=450){
      const batch = db.batch();
      docs.slice(i,i+450).forEach(d=>batch.delete(d.ref));
      await batch.commit();
    }
  }
  await wipeCollection('registros');
  await wipeCollection('personal');
  await wipeCollection('pacientes');
  await db.collection('meta').doc('catalogo').set({ categorias: CATALOGO_SEED });
  await db.collection('meta').doc('config').set(defaultConfig());
  await seedFirestoreIfEmpty();
}

/* ------------------------------ Exportar CSV ------------------------------ */
function exportCsvDetalle(){
  const regs = filteredRegistros();
  let out = ['Fecha;Turno;Personal;Paciente;Categoria;Actividad;Grado;Cantidad;MinutoPorUnidad;SubtotalMin'];
  regs.forEach(r=>{
    r.items.forEach(it=>{
      out.push([r.fecha, r.turno, r.personalNombre, it.pacienteNombre||'', it.categoriaNombre, it.actividadNombre, it.grado||'', it.cantidad, it.tiempoUnit, it.subtotal].map(csvEscape).join(';'));
    });
  });
  downloadFile('detalle_productividad_'+todayISO()+'.csv', out.join('\n'), 'text/csv;charset=utf-8');
}
function exportCsvResumen(){
  const groups = buildResumenGroups();
  let out = ['Fecha;Turno;Personal;TotalMin;TotalHHMM;HorasEstandar;Porcentaje'];
  groups.forEach(g=>{
    const horasEstandar = g.turno==='GN' ? (STATE.config.horasTurnoGN||12) : (STATE.config.horasTurnoGD||12);
    const pct = horasEstandar>0 ? Math.round((g.totalMin/60/horasEstandar)*100) : 0;
    out.push([g.fecha, g.turno, g.personalNombre, g.totalMin, minToHM(g.totalMin), horasEstandar, pct+'%'].map(csvEscape).join(';'));
  });
  downloadFile('resumen_productividad_'+todayISO()+'.csv', out.join('\n'), 'text/csv;charset=utf-8');
}

/* -------------------------------- Init -------------------------------- */
render(); // pantalla de "Cargando…" mientras se resuelve la sesión de Google

auth.onAuthStateChanged(async (user)=>{
  AUTH_USER = user;
  if(!user){
    AUTH_STATE = 'signedout';
    AUTHORIZED_EMAILS = [];
    detachFirestoreListeners();
    SESSION = null;
    render();
    return;
  }
  AUTH_STATE = 'checking';
  render();
  try{
    const email = (user.email||'').toLowerCase();
    const doc = await db.collection('authorized_emails').doc(email).get();
    if(doc.exists){
      AUTH_STATE = 'ready';
      await seedFirestoreIfEmpty();
      attachFirestoreListeners();
      goto('login');
    } else {
      AUTH_STATE = 'unauthorized';
      render();
    }
  }catch(e){
    console.error('Error verificando acceso', e);
    AUTH_STATE = 'unauthorized';
    render();
  }
});
